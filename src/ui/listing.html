<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Main Photo · Listing Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%239b2c2c%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/ui/listing.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7.5 9.2a1.9 2.3 0 1 0 0-.01M16.5 9.2a1.9 2.3 0 1 0 0-.01M4.6 13.4a1.6 1.9 0 1 0 0-.01M19.4 13.4a1.6 1.9 0 1 0 0-.01M12 12.6c-2.6 0-4.8 2.6-4.8 4.5 0 1.5 1.2 2.3 2.6 2.3 1 0 1.5-.5 2.2-.5s1.2.5 2.2.5c1.4 0 2.6-.8 2.6-2.3 0-1.9-2.2-4.5-4.8-4.5z" fill="currentColor"/></svg>
      </span>
      <div>
        <strong>Here You Go Pup</strong>
        <span>Listing photo studio</span>
      </div>
    </div>
    <span id="status" class="status" role="status" aria-live="polite"></span>
  </header>

  <main class="layout">
    <section class="preview" aria-label="Main photo preview">
      <div class="preview-top">
        <div>
          <h1>Main photo</h1>
          <p class="sub">Updates live as you change the settings.</p>
        </div>
        <div class="seg" role="group" aria-label="View">
          <button type="button" data-view="result" class="on" aria-pressed="true">Result</button>
          <button type="button" data-view="compare" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M6.5 7 3.5 10l3 3M13.5 7l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Compare with original
          </button>
        </div>
      </div>

      <div class="stage-wrap">
        <div class="stage" id="stage">
          <canvas id="photo" width="3000" height="2250" aria-label="Main listing photo"></canvas>
          <div class="compare" id="compare" hidden>
            <div class="orig" id="origWrap"><img id="orig" alt="Original template photo" draggable="false" /></div>
            <span class="tag left">Original</span>
            <span class="tag right">Your design</span>
            <div class="handle" id="handle" role="slider" tabindex="0" aria-label="Compare position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
              <span class="knob" aria-hidden="true">
                <svg viewBox="0 0 20 20"><path d="M7.5 6 3.5 10l4 4M12.5 6l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
            </div>
          </div>
          <div class="loader" id="busy">
            <div class="loader-card">
              <span class="ring" aria-hidden="true"></span>
              <span id="busyText">Loading photo…</span>
            </div>
          </div>
        </div>
      </div>

      <div class="dl-bar">
        <div class="facts" id="facts"></div>
        <div class="download">
          <button id="dlJpg" class="btn ghost" disabled title="Smaller file (JPG, high quality)">JPG</button>
          <button id="dlPng" class="btn primary" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 15.5h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download photo
          </button>
        </div>
      </div>
    </section>

    <aside class="panel" aria-label="Photo settings">
      <div class="panel-head">
        <h2>Customize</h2>
        <p>Four quick steps. Everything is applied to the real photo.</p>
      </div>

      <details class="step" id="stepPattern" open>
        <summary><span class="n">1</span><span class="t">Pattern</span><span class="v" id="sumPattern"></span><span class="chev" aria-hidden="true"></span></summary>
        <div class="step-body" id="patternBody"></div>
      </details>

      <details class="step" id="stepFinish">
        <summary><span class="n">2</span><span class="t">Buckle colors</span><span class="v" id="sumFinish"></span><span class="chev" aria-hidden="true"></span></summary>
        <div class="step-body" id="finishBody"></div>
      </details>

      <details class="step" id="stepNames">
        <summary><span class="n">3</span><span class="t">Names on the buckles</span><span class="v" id="sumNames"></span><span class="chev" aria-hidden="true"></span></summary>
        <div class="step-body" id="namesBody"></div>
      </details>

      <details class="step" id="stepBg">
        <summary><span class="n">4</span><span class="t">Background</span><span class="v" id="sumBg"></span><span class="chev" aria-hidden="true"></span></summary>
        <div class="step-body" id="bgBody"></div>
      </details>
    </aside>
  </main>

  <script src="/mockup/core.js"></script>
  <script src="/mockup/plan.js"></script>
  <script src="/ui/render-client.js"></script>
  <script src="/ui/listing.js"></script>
</body>
</html>
